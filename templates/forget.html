<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MinuteMate | Reset Password</title>
    <!-- Load Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Custom styles to ensure the Inter font is used */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Mobile adjustment for the visual side */
        @media (max-width: 1024px) {
            .visual-side {
                display: none;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <!-- Main Container -->
    <div class="bg-white shadow-2xl rounded-2xl overflow-hidden max-w-4xl w-full mx-auto 
                grid grid-cols-1 lg:grid-cols-2 transform hover:scale-[1.01] transition-transform duration-300">
        
        <!-- Form Side (Left) -->
        <div class="p-8 md:p-12 space-y-8 flex flex-col justify-center">
            <div class="text-center lg:text-left">
                <h1 class="text-3xl md:text-4xl font-extrabold text-gray-800 mb-2">Reset Password</h1>
                <p class="text-gray-500 text-base">
                    Enter your registered email below to receive instructions.
                </p>
            </div>

            <!-- Message Area (for success/error messages) -->
            <div id="message-box" class="hidden p-4 rounded-xl bg-green-100 border border-green-400 text-green-700 text-sm font-medium">
                <!-- Message content will be injected here -->
            </div>

            <!-- Form -->
            <!-- FIX: Changed url_for('forget') to url_for('auth.forget') -->
            <form id="reset-form" onsubmit="handleSubmit(event)" method="POST" action="{{ url_for('auth.forget') }}" class="space-y-6">
                
                <div>
                    <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="you@example.com" 
                        required 
                        class="w-full p-3 border border-gray-300 rounded-xl focus:ring-indigo-600 focus:border-indigo-600 transition duration-150"
                    />
                </div>

                <button 
                    type="submit" 
                    id="submit-button"
                    class="w-full py-3 bg-indigo-600 text-white font-bold text-lg rounded-xl shadow-lg 
                           hover:bg-indigo-700 transition duration-300 ease-in-out transform hover:scale-[1.02] 
                           focus:outline-none focus:ring-4 focus:ring-indigo-500 focus:ring-opacity-50"
                >
                    Send Reset Link
                </button>
            </form>

            <div class="text-center mt-6">
                <!-- FIX: Changed url_for('login') to url_for('auth.login') -->
                <a href="{{ url_for('auth.login') }}" class="text-sm font-semibold text-indigo-600 hover:text-indigo-800 transition duration-150">
                    ← Back to Sign In
                </a>
            </div>
        </div>

        <!-- Visual Side (Right) - Hidden on Mobile -->
        <div class="visual-side p-12 bg-indigo-600 text-white flex flex-col items-center justify-center text-center">
            <!-- Placeholder for a simple, relevant visual/icon -->
            <div class="text-6xl mb-6">🔑</div>
            <h2 class="text-3xl font-bold mb-4">Secure Your Account</h2>
            <p class="text-indigo-200 text-lg">
                We'll send a secure link to your email to quickly regain access. Your security is our top priority.
            </p>
            <div class="w-full h-32 mt-6 rounded-xl bg-indigo-700 bg-opacity-30 flex items-center justify-center">
                <!-- Simple illustration placeholder -->
                <p class="text-indigo-300 font-medium">MinuteMate Security</p>
            </div>
        </div>
    </div>

    <script>
        // Get references to elements
        const form = document.getElementById('reset-form');
        const emailInput = document.getElementById('email');
        const messageBox = document.getElementById('message-box');
        const submitButton = document.getElementById('submit-button');
        
        // Function to simulate form submission and display success message
        function handleSubmit(e) {
            e.preventDefault();
            
            // In a real application, you would perform a fetch request here.
            // fetch(form.action, { method: form.method, body: new FormData(form) })
            // .then(response => { ... })
            
            const email = emailInput.value;

            // Simulate loading state (optional but good UX)
            submitButton.disabled = true;
            submitButton.textContent = 'Sending...';

            // Simulate API delay
            setTimeout(() => {
                // Restore button state
                submitButton.disabled = false;
                submitButton.textContent = 'Send Reset Link';

                // Display custom success message
                messageBox.classList.remove('hidden', 'bg-red-100', 'border-red-400', 'text-red-700');
                messageBox.classList.add('bg-green-100', 'border-green-400', 'text-green-700');
                messageBox.innerHTML = `✅ Successfully sent a reset link to <strong>${email}</strong>. Please check your inbox!`;

                // Clear message after 7 seconds
                setTimeout(() => {
                    messageBox.classList.add('hidden');
                }, 7000);
                
                // Optional: Clear input field
                emailInput.value = '';

            }, 1500); // 1.5 second delay
        }
    </script>
</body>
</html>
