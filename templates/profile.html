<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>MinuteMate by Axilivo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.png') }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" type="text/css" media="screen" href="{{ url_for('static', filename='css/perfect-scrollbar.min.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/highlight.min.css') }}" />
    <link rel="stylesheet" type="text/css" media="screen" href="{{ url_for('static', filename='css/style.css') }}" />
    <link defer rel="stylesheet" type="text/css" media="screen" href="{{ url_for('static', filename='css/animate.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/swiper-bundle.min.css') }}" />

    <script src="{{ url_for('static', filename='js/perfect-scrollbar.min.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/popper.min.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/tippy-bundle.umd.min.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/sweetalert.min.js') }}"></script>
</head>

<body x-data="main" class="relative overflow-x-hidden font-nunito text-sm font-normal antialiased"
    :class="[ $store.app.sidebar ? 'toggle-sidebar' : '', $store.app.theme === 'dark' || $store.app.isDarkMode ?  'dark' : '', $store.app.menu, $store.app.layout,$store.app.rtlClass]">

    <div x-cloak class="fixed inset-0 z-50 bg-[black]/60 lg:hidden" :class="{'hidden' : !$store.app.sidebar}" @click="$store.app.toggleSidebar()"></div>

    <div class="screen_loader animate__animated fixed inset-0 z-[60] grid place-content-center bg-[#fafafa] dark:bg-[#060818]">
        <svg width="64" height="64" viewBox="0 0 135 135" xmlns="http://www.w3.org/2000/svg" fill="#4361ee">

    </div>

    <div class="fixed bottom-6 z-50 ltr:right-6 rtl:left-6" x-data="scrollToTop">
        <template x-if="showTopButton">
            <button type="button" class="btn btn-outline-primary animate-pulse rounded-full bg-[#fafafa] p-2 dark:bg-[#060818] dark:hover:bg-primary"
                @click="goToTop">
                <svg width="24" height="24" class="h-4 w-4" viewBox="0 0 24 24" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <path opacity="0.5" fill-rule="evenodd" clip-rule="evenodd"
                        d="M12 20.75C12.4142 20.75 12.75 20.4142 12.75 20L12.75 10.75L11.25 10.75L11.25 20C11.25 20.4142 11.5858 20.75 12 20.75Z"
                        fill="currentColor" />
                    <path d="M6.00002 10.75C5.69667 10.75 5.4232 10.5673 5.30711 10.287C5.19103 10.0068 5.25519 9.68417 5.46969 9.46967L11.4697 3.46967C11.6103 3.32902 11.8011 3.25 12 3.25C12.1989 3.25 12.3897 3.32902 12.5304 3.46967L18.5304 9.46967C18.7449 9.68417 18.809 10.0068 18.6929 10.287C18.5768 10.5673 18.3034 10.75 18 10.75L6.00002 10.75Z"
                        fill="currentColor" />
                </svg>
            </button>
        </template>
    </div>

    <div class="main-container min-h-screen text-black dark:text-white-dark" :class="[$store.app.navbar]">
        <div class="main-content flex min-h-screen flex-col">

            <!-- Header -->
            <header class="z-40">
                <div class="shadow-sm">
                    <div class="relative flex w-full items-center bg-white px-5 py-2.5 dark:bg-[#0e1726]">
                        <div class="horizontal-logo flex items-center justify-between ltr:mr-2 rtl:ml-2 lg:hidden">
                            <a href="{{ url_for('auth.login') }}" class="main-logo flex shrink-0 items-center">
                                <img class="inline w-8 ltr:-ml-1 rtl:-mr-1"
                                    src="{{ url_for('static', filename='images/logo.svg') }}" alt="image" />
                                <span class="hidden align-middle text-2xl font-semibold transition-all duration-300 ltr:ml-1.5 rtl:mr-1.5 dark:text-white-light md:inline">Axilivo</span>
                            </a>
                        </div>

                        <div class="dropdown flex-shrink-0" x-data="dropdown" @click.outside="open = false">
                            <a href="javascript:;" class="group relative" @click="toggle()">
                                <span>
                                    <img class="h-9 w-9 rounded-full object-cover saturate-50 group-hover:saturate-100"
                                        src="{{ url_for('static', filename='images/user-profile.jpeg') }}" alt="image" />
                                </span>
                            </a>
                            <ul x-cloak x-show="open" x-transition x-transition.duration.300ms
                                class="top-11 w-[230px] !py-0 font-semibold text-dark ltr:right-0 rtl:left-0 dark:text-white-dark dark:text-white-light/90">
                                <li>
                                    <div class="flex items-center px-4 py-4">
                                        <div class="flex-none">
                                            <img class="h-10 w-10 rounded-md object-cover"
                                                src="{{ url_for('static', filename='images/user-profile.jpeg') }}" alt="image" />
                                        </div>
                                        <div class="truncate ltr:pl-4 rtl:pr-4">
                                            <h4 class="text-base">John Doe</h4>
                                            <a class="text-black/60 dark:text-dark-light/60" href="javascript:;">johndoe@gmail.com</a>
                                        </div>
                                    </div>
                                </li>
                                <li class="border-t border-white-light dark:border-white-light/10">
                                    <a href="{{ url_for('auth.login') }}" class="!py-3 text-danger">
                                        <svg class="h-4.5 w-4.5 rotate-90 ltr:mr-2 rtl:ml-2" width="18" height="18"
                                            viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <path opacity="0.5"
                                                d="M17 9.00195C19.175 9.01406 20.3529 9.11051 21.1213 9.8789C22 10.7576 22 12.1718 22 15.0002V16.0002C22 18.8286 22 20.2429 21.1213 21.1215C20.2426 22.0002 18.8284 22.0002 16 22.0002H8C5.17157 22.0002 3.75736 22.0002 2.87868 21.1215C2 20.2429 2 18.8286 2 16.0002L2 15.0002C2 12.1718 2 10.7576 2.87868 9.87889C3.64706 9.11051 4.82497 9.01406 7 9.00195"
                                                stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                                            <path d="M12 15L12 2M12 2L15 5.5M12 2L9 5.5"
                                                stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                                stroke-linejoin="round" />
                                        </svg>
                                        Sign Out
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </header>

            <div class="p-6">
                <div class="panel">
                    <div class="mb-5 flex items-center justify-between">
                        <h5 class="text-lg font-semibold dark:text-white-light">Profile Update</h5>
                    </div>
                    <form class="space-y-5">
                        <div><label for="name">Name</label>
                            <input id="name" type="text" placeholder="Enter name" class="form-input" />
                        </div>
                        <div><label for="email">Email</label>
                            <input id="email" type="email" placeholder="Enter email" class="form-input" />
                        </div>
                        <div><label for="mobile_no">Mobile No.</label>
                            <input id="mobile_no" type="text" placeholder="Enter mobile number" class="form-input" />
                        </div>
                        <div class="flex gap-2">
                            <button type="submit" class="btn btn-primary">Submit</button>
                            <button type="reset" class="btn btn-secondary">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="mt-auto p-6 text-center dark:text-white-dark">
                © <span id="footer-year">2025</span>. Axilivo All rights reserved.
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/highlight.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/alpine-collaspe.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/alpine-persist.min.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/alpine-ui.min.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/alpine-focus.min.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/alpine.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/custom.js') }}"></script>
    <script src="{{ url_for('static', filename='js/simple-datatables.js') }}"></script>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('scrollToTop', () => ({
                showTopButton: false,
                init() {
                    window.onscroll = () => this.scrollFunction();
                },
                scrollFunction() {
                    this.showTopButton = document.body.scrollTop > 50 || document.documentElement.scrollTop > 50;
                },
                goToTop() {
                    document.body.scrollTop = 0;
                    document.documentElement.scrollTop = 0;
                },
            }));
        });
    </script>

</body>
</html>
