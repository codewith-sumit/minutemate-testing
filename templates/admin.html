<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <title>Admin Panel | MinuteMate by Axilivo</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        
        <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.png') }}" />
        
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
        
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

        <style>
            /* Custom styles for background and blur effect (to replace Tailwind/Alpine classes) */
            .admin-bg-wrapper {
                min-height: 100vh;
                background-size: cover;
                background-position: center;
                /* Background Map Image */
                background-image: url("{{ url_for('static', filename='images/auth/map.png') }}");
            }
            .admin-card {
                background-color: rgba(255, 255, 255, 0.9); /* Light translucent background */
                backdrop-filter: blur(5px); /* Blur effect */
                -webkit-backdrop-filter: blur(5px);
            }
            /* Custom Primary Color for consistent look (adjust if your 'primary' color is different) */
            .bg-primary-custom {
                background-color: #4361ee !important; /* Assuming this is your primary color from SVG loader */
                color: white;
            }
        </style>
    </head>

    <body class="bg-light">
        <div class="admin-bg-wrapper d-flex align-items-center justify-content-center p-3 p-sm-5">
            <div class="admin-card card shadow-lg w-100 p-4 p-lg-5 rounded-3" style="max-width: 1200px;">
                <div class="text-center mb-5">
                    <h1 class="text-primary fw-bolder text-uppercase fs-2">🛠 Admin Panel</h1>
                </div>

                <div class="text-center mb-4">
                    <button
                        class="btn btn-primary btn-lg text-uppercase shadow"
                        id="toggleBtn"
                        onclick="toggleTable()"
                    >
                        <span id="btnText">👤 Show Users</span>
                    </button>
                </div>

                <div id="userTable" class="w-100">
                    {% if users %}
                    <div class="table-responsive">
                        <table id="userTableContent" class="table table-striped table-hover align-middle mt-3" style="display: none;">
                            <thead class="bg-primary-custom text-white">
                                <tr>
                                    <th class="p-3">ID</th>
                                    <th class="p-3">Name</th>
                                    <th class="p-3">Email</th>
                                    <th class="p-3">Role</th>
                                    <th class="p-3">Created</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for user in users %}
                                <tr>
                                    <td class="p-3">{{ user.id }}</td>
                                    <td class="p-3">{{ user.name }}</td>
                                    <td class="p-3">{{ user.email }}</td>
                                    <td class="p-3">{{ user.role }}</td>
                                    <td class="p-3">{{ user.created_at.strftime('%Y-%m-%d %H:%M') }}</td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                    {% else %}
                        <p class="text-center text-secondary mt-4">No users found.</p>
                    {% endif %}
                </div>

                <div class="text-center mt-5">
                    <a
                        href="{{ url_for('dashboard.dashboard') }}"
                        class="text-decoration-underline text-primary fw-bold fs-5"
                    >
                        ← Back to Dashboard
                    </a>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

        <script>
            // JS for showing/hiding the user table (Kept the original plain JS logic)
            function toggleTable() {
                const table = document.getElementById('userTableContent');
                const btnText = document.getElementById('btnText');

                // Check for 'none' or initial empty state for 'display' style
                if (table.style.display === 'none' || table.style.display === '') {
                    table.style.display = 'table'; // Show table
                    btnText.textContent = '👤 Hide Users';
                } else {
                    table.style.display = 'none'; // Hide table
                    btnText.textContent = '👤 Show Users';
                }
            }

            /* The scroll-to-top feature, which was Alpine.js dependent, has been removed/simplified
               to maintain a cleaner Bootstrap implementation. */
        </script>
    </body>
</html>
